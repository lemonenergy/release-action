name: 'release-action'
description: 'Bumps package version and creates release.'

inputs:
  base-branch:
    description: 'Branch in which release will be merged'
    required: true
    default: 'main'

  head-branch:
    description: 'Branch to be released'
    required: true
    default: 'develop'

  github-token:
    description: 'GitHub token (PAT) or GitHub App private key when github-app-id is provided'
    required: true

  github-app-id:
    description: 'GitHub App ID. When provided, github-token is treated as the App private key and a short-lived installation token is generated automatically'
    default: ''

  skip-ci:
    description: 'Append [skip ci] to the version bump commit message to prevent triggering new workflow runs'
    default: 'false'

  initial-version:
    description: "Initial version used if base-branch doesn't have package.json"
    default: '0.0.0'

  path:
    description: 'Path where the target package.json is located'
    default: ''

outputs:
  version:
    description: 'The next version'

runs:
  using: 'node24'
  main: 'index.js'
